<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rekap</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/rekap.css" />
    <link rel="stylesheet" href="../assets/css/toast.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <button id="langBtn" onclick="switchLanguage(getLang() === 'id' ? 'en' : 'id')">EN</button>
    <div class="container">
      <!-- HEADER -->
      <div class="header">
        <div class="header-top">
          <div class="avatar">R</div>
          <div>
            <h2 data-i18n="recapTitle">Rekap</h2>
            <p data-i18n="recapSubtitle">Ringkasan aktivitas dan statistik</p>
          </div>
        </div>
      </div>

      <!-- CARDS -->
      <div class="cards">
        <div class="card">
          <h3 data-i18n="totalSchedule">Total Jadwal</h3>
          <div class="stat-large" id="totalJadwal">0</div>
        </div>

        <div class="card">
          <h3 data-i18n="totalAgenda">Total Agenda</h3>
          <div class="stat-large" id="totalAgenda">0</div>
        </div>

        <div class="card">
          <h3 data-i18n="totalReminder">Total Reminder</h3>
          <div class="stat-large" id="totalReminder">0</div>
        </div>
      </div>

      <!-- CHART -->
      <div class="card">
        <h3 data-i18n="weeklyChart">Grafik Mingguan</h3>
        <canvas id="weeklyChart" height="80"></canvas>
      </div>

      <!-- AGENDA STATUS CHART -->
      <div class="card">
        <h3 data-i18n="agendaStatus">Status Agenda</h3>
        <canvas id="agendaChart" height="80"></canvas>
      </div>

      <!-- CLASS FREQUENCY CHART -->
      <div class="card">
        <h3 data-i18n="classFrequency">Frekuensi Kelas</h3>
        <canvas id="classChart" height="80"></canvas>
      </div>
    </div>

    <!-- NAVBAR -->
    <div class="navbar">
      <div class="nav-item" onclick="goDashboard()">
        <i class="bx bx-home"></i>
      </div>
      <div class="nav-item" onclick="goJadwal()">
        <i class="bx bx-book"></i>
      </div>
      <div class="nav-item" onclick="goRekap()">
        <i class="bx bx-bar-chart"></i>
      </div>
      <div class="nav-item" onclick="goAgenda()">
        <i class="bx bx-task"></i>
      </div>
      <div class="nav-item" onclick="goSettings()">
        <i class="bx bx-cog"></i>
      </div>
    </div>

    <script src="../assets/js/language.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/rekap.js"></script>
  </body>
</html>
