<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Mahasiswa</title>
    <link rel="stylesheet" href="../assets/css/register.css" />
    <link rel="stylesheet" href="../assets/css/toast.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <button id="langBtn" onclick="switchLanguage(getLang() === 'id' ? 'en' : 'id')">EN</button>
    <div class="container">
      <div class="card">
        <!-- Gambar -->
        <div class="image">
          <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png"
            alt=""
          />
        </div>

        <h2 data-i18n="register">Buat Akun</h2>
        <p data-i18n="registerSubtitle">Silakan isi form untuk mendaftar.</p>

        <!-- FORM -->
        <form id="registerForm">
          <div class="input-box">
            <i class="bx bx-user"></i>
            <input type="text" id="nama" placeholder="Nama Lengkap" data-i18n-placeholder="name" required />
          </div>

          <div class="input-box">
            <i class="bx bx-id-card"></i>
            <input type="text" id="nim" placeholder="NIM" data-i18n-placeholder="studentId" required />
          </div>

          <div class="input-box">
            <i class="bx bx-envelope"></i>
            <input type="email" id="email" placeholder="Email" data-i18n-placeholder="email" required />
          </div>

          <div class="input-box">
            <i class="bx bx-lock-alt"></i>
            <input
              type="password"
              id="password"
              placeholder="Password"
              data-i18n-placeholder="password"
              required
            />
            <span class="toggle-password" onclick="togglePassword()">
              <i class="bx bx-hide"></i>
            </span>
          </div>

          <small class="note" data-i18n="passwordNote">Minimal 8 karakter</small>

          <button type="submit" class="btn" data-i18n="register">Daftar</button>
        </form>

        <p class="login-link">
          <span data-i18n="haveAccount">Sudah punya akun?</span> <a href="../index.html" data-i18n="login">Login</a>
        </p>
      </div>
    </div>
  </body>
  <script src="../assets/js/language.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/register.js"></script>
</html>
