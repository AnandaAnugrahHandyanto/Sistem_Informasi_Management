<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadwal Kuliah</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/jadwal.css" />
  </head>

  <body>
    <button id="langBtn" onclick="switchLanguage(getLang() === 'id' ? 'en' : 'id')">EN</button>
    <div class="app">
      <!-- header -->
      <div class="header">
        <h2 data-i18n="scheduleTitle">Jadwal Kuliah</h2>
        <button onclick="backDashboard()" class="dashboard-btn">
          <span class="material-symbols-outlined">arrow_left</span>
          <span data-i18n="backDashboard">Kembali ke Dashboard</span>
        </button>
      </div>

      <!-- tab -->
      <div class="tabs">
        <button class="active" data-i18n="thisWeek">Minggu Ini</button>
        <button data-i18n="calendar">Kalender</button>
      </div>

      <!-- grid -->
      <div class="grid" id="grid"></div>

      <button class="add-btn" onclick="openModal()"><span data-i18n="addScheduleBtn">+ Tambah Jadwal</span></button>
    </div>

    <!-- modal -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <h3 data-i18n="addSchedule">Tambah Jadwal</h3>

        <input type="text" id="matkul" data-i18n-placeholder="subject" placeholder="Masukkan mata kuliah..." />

        <div>
          <label style="font-size: 12px; color: #9fb0d8; display: block; margin-bottom: 8px;" data-i18n="date">Tanggal</label>
          <input type="date" id="tanggal" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(96,165,250,0.3); background: rgba(30,41,59,0.6); color: #dbefff; box-sizing: border-box; margin-bottom: 12px;" />
        </div>

        <div class="time-wrapper">
          <div>
            <label style="font-size: 12px; color: #9fb0d8" data-i18n="startTime">Jam Mulai</label>
            <input type="time" id="jamMulai" value="08:00" step="60" />
          </div>
          <div>
            <label style="font-size: 12px; color: #9fb0d8" data-i18n="endTime">Jam Selesai</label>
            <input type="time" id="jamSelesai" value="09:30" step="60" />
          </div>
        </div>

        <select id="warna">
          <option value="blue" data-i18n="blue">Biru</option>
          <option value="green" data-i18n="green">Hijau</option>
          <option value="orange" data-i18n="orange">Orange</option>
          <option value="red" data-i18n="red">Merah</option>
        </select>

        <div class="button-group">
          <button onclick="tambahJadwal()" data-i18n="save">Simpan</button>
          <button onclick="closeModal()" class="cancel" data-i18n="cancel">Batal</button>
        </div>
      </div>
    </div>

    <!-- navbar -->
    <div class="navbar">
      <div class="nav-item" onclick="goDashboard()">
        <i class="bx bx-home"></i>
      </div>
      <div class="nav-item" onclick="goJadwal()">
        <i class="bx bx-book"></i>
      </div>
      <div class="nav-item" onclick="goRekap()">
        <i class="bx bx-bar-chart"></i>
      </div>
      <div class="nav-item" onclick="goAgenda()">
        <i class="bx bx-task"></i>
      </div>
      <div class="nav-item" onclick="goSettings()">
        <i class="bx bx-cog"></i>
      </div>
    </div>

    <script src="../assets/js/language.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/jadwal.js"></script>
  </body>
</html>
