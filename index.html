<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Mahasiswa</title>
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/toast.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <div class="card">
        <!-- Gambar -->
        <div class="image">
          <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png"
            alt="foto"
          />
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <div>
            <h2 data-i18n="welcome">Selamat Datang!</h2>
            <p data-i18n="loginSubtitle">Silakan login untuk melanjutkan.</p>
          </div>
          <button id="langBtn" onclick="switchLanguage(getLang() === 'id' ? 'en' : 'id')" style="padding: 8px 12px; background: #3b82f6; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: 700;">EN</button>
        </div>

        <!-- FORM -->
        <form id="loginForm">
          <div class="input-box">
            <i class="bx bx-id-card"></i>
            <input type="text" id="nim" data-i18n-placeholder="nim" placeholder="NIM" required />
          </div>

          <div class="input-box">
            <i class="bx bx-lock-alt"></i>
            <input
              type="password"
              id="password"
              data-i18n-placeholder="password"
              placeholder="Password"
              required
            />
            <span class="toggle-password" onclick="togglePassword()">
              <i class="bx bx-hide"></i>
            </span>
          </div>

          <div class="forgot">
            <a href="#" data-i18n="forgotPassword">Lupa Password?</a>
          </div>

          <button type="submit" class="btn" data-i18n="login">Login</button>
        </form>

        <p class="help">
          <span data-i18n="noAccount">Belum punya akun?</span> <a href="pages/register.html" data-i18n="register">Daftar</a>
        </p>
      </div>
    </div>
  </body>
  <script src="assets/js/language.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/script.js"></script>
</html>
